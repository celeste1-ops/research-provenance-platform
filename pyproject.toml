[project]
name = "rprov"
version = "0.3.0"
description = "Local research-evolution evidence tool: append-only signed records with third-party timestamps."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "cryptography>=44",
    "rfc3161-client>=1.0.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "keyring>=25",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
ots = ["opentimestamps>=0.4.5,<0.5"]
# The double-click desktop app: menu-bar / system-tray icon (D-044).
desktop = ["pystray>=0.19", "pillow>=10"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "rfc8785>=0.1.4",
    "playwright>=1.47",
]
# Building the installers (macOS .dmg, Windows setup .exe).
package = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/provenance_core", "app"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs real FreeTSA / OpenTimestamps access (skipped unless RPROV_NETWORK_TESTS=1)",
    "e2e: browser end-to-end tests (Playwright)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "provenance_core", "tests"]
