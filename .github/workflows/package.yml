name: Package

# Builds the installers (DECISIONS D-044) and checks each one end to end: install, start without
# browser or tray icon, set up, save a step, export, run the bundled verify.py, (Windows:)
# uninstall and check the data folder stays. The installers are kept as workflow artifacts; a
# version tag (v0.3.0, matching pyproject.toml) also puts both into a draft GitHub release, and
# so does running this workflow by hand on main with "release" ticked. Publishing that draft
# creates the tag on the commit the installers were built from.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release v<version from pyproject.toml> from this commit (main only)"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: ./packaging/build_windows.ps1
      - name: Smoke test (install, run, verify, uninstall)
        run: ./packaging/smoke_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchHistory-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the app and disk image (includes the smoke test)
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchHistory-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft a release with both installers and their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release that already exists keeps its files, so they always match its SHA256SUMS.txt:
          # running this again only brings a draft's notes up to date with RELEASE_NOTES.md, and
          # publishing a draft (which creates its tag and so runs this workflow again) changes nothing.
          # A draft's tag_name only reads back as the tag before an edit (the API clears it unless the
          # edit sends it again), so drafts are matched by title too.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\"
              or (.draft and .name == \"Research History $TAG\")) | \"\(.id) \(.draft) \(.target_commitish)\"" | head -n 1)
          if [ -n "$release" ]; then
            read -r id draft target <<< "$release"
            if [ "$draft" = "true" ]; then
              keep=(-f tag_name="$TAG")
              [ -n "$target" ] && keep+=(-f target_commitish="$target")
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@packaging/RELEASE_NOTES.md "${keep[@]}" > /dev/null
              echo "draft $TAG: notes updated from packaging/RELEASE_NOTES.md, files left as they are"
            else
              echo "release $TAG is already published; nothing to do"
            fi
            exit 0
          fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Research History $TAG" \
            --notes-file packaging/RELEASE_NOTES.md dist/*
