name: Package

# Builds the installers (DECISIONS D-044) and checks each one end to end: install, start without
# browser or tray icon, set up, save a step, export, run the bundled verify.py, (Windows:)
# uninstall and check the data folder stays. The installers are kept as workflow artifacts; a
# version tag (v0.3.0, matching pyproject.toml) also puts both into a draft GitHub release, and
# so does running this workflow by hand on main with "release" ticked. Publishing that draft
# creates the tag on the commit the installers were built from.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release v<version from pyproject.toml> from this commit (main only)"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: ./packaging/build_windows.ps1
      - name: Smoke test (install, run, verify, uninstall)
        run: ./packaging/smoke_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchHistory-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the app and disk image (includes the smoke test)
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchHistory-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft a release with both installers and their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release that already exists is left as it is, so its installers always match its
          # SHA256SUMS.txt; publishing a draft creates its tag, which runs this workflow again. To
          # redo a draft, delete it on GitHub and run this again. (Editing a draft through the API
          # clears its tag name, and putting the tag back is refused to this workflow's token.)
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\"
              or (.draft and .name == \"Research History $TAG\")) | .html_url" | head -n 1)
          if [ -n "$found" ]; then
            echo "release $TAG already exists ($found); nothing to do"; exit 0
          fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Research History $TAG" \
            --notes-file packaging/RELEASE_NOTES.md dist/*
